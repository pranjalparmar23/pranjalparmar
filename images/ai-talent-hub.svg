<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171f2b"/>
      <stop offset="100%" stop-color="#1f2733"/>
    </linearGradient>
    <radialGradient id="glowAI" cx="50%" cy="26%" r="55%">
      <stop offset="0%" stop-color="#0ef" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0ef" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgAI)"/>
  <rect width="600" height="600" fill="url(#glowAI)"/>

  <!-- agent network graph -->
  <g stroke="#0ef" stroke-width="1.5" opacity="0.8" transform="translate(0,35)">
    <line x1="300" y1="110" x2="215" y2="165"/>
    <line x1="300" y1="110" x2="385" y2="165"/>
    <line x1="215" y1="165" x2="215" y2="215"/>
    <line x1="385" y1="165" x2="385" y2="215"/>
    <line x1="215" y1="165" x2="300" y2="204"/>
    <line x1="385" y1="165" x2="300" y2="204"/>
    <line x1="300" y1="204" x2="300" y2="110"/>
  </g>
  <g transform="translate(0,35)">
    <circle cx="300" cy="110" r="22" fill="#0ef"/>
    <circle cx="215" cy="165" r="14" fill="#2d3542" stroke="#0ef" stroke-width="2"/>
    <circle cx="385" cy="165" r="14" fill="#2d3542" stroke="#0ef" stroke-width="2"/>
    <circle cx="215" cy="215" r="12" fill="#2d3542" stroke="#fff" stroke-width="2"/>
    <circle cx="385" cy="215" r="12" fill="#2d3542" stroke="#fff" stroke-width="2"/>
    <circle cx="300" cy="204" r="16" fill="#171f2b" stroke="#0ef" stroke-width="2"/>
  </g>

  <!-- resume/document glyph inside top node -->
  <g fill="#171f2b" transform="translate(0,35)">
    <rect x="293" y="101" width="14" height="18" rx="2"/>
  </g>
  <g fill="#fff" transform="translate(0,35)">
    <rect x="295" y="104" width="10" height="1.6"/>
    <rect x="295" y="108" width="10" height="1.6"/>
    <rect x="295" y="112" width="6" height="1.6"/>
  </g>

  <text x="300" y="350" font-family="Poppins, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">AI</text>
  <text x="300" y="386" font-family="Poppins, sans-serif" font-size="15" fill="#0ef" text-anchor="middle" letter-spacing="0.5">MIRPP</text>
</svg>
