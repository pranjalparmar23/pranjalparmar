<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgJG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171f2b"/>
      <stop offset="100%" stop-color="#1f2733"/>
    </linearGradient>
    <radialGradient id="glowJG" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0ef" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0ef" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgJG)"/>
  <rect width="600" height="600" fill="url(#glowJG)"/>

  <!-- decorative stacked article cards + mentorship figures, centered on canvas -->
  <g transform="translate(0,107.5)">
    <g opacity="0.9">
      <rect x="150" y="120" width="160" height="115" rx="10" fill="#2d3542" stroke="#0ef" stroke-width="1.5"/>
      <rect x="172" y="143" width="116" height="9" rx="4.5" fill="#0ef"/>
      <rect x="172" y="164" width="116" height="5.5" rx="2.5" fill="#7c8594"/>
      <rect x="172" y="178" width="116" height="5.5" rx="2.5" fill="#7c8594"/>
      <rect x="172" y="192" width="80" height="5.5" rx="2.5" fill="#7c8594"/>

      <rect x="195" y="150" width="160" height="115" rx="10" fill="#2d3542" stroke="#0ef" stroke-width="1.5"/>
      <rect x="217" y="173" width="116" height="9" rx="4.5" fill="#0ef"/>
      <rect x="217" y="194" width="116" height="5.5" rx="2.5" fill="#7c8594"/>
      <rect x="217" y="208" width="116" height="5.5" rx="2.5" fill="#7c8594"/>
      <rect x="217" y="222" width="80" height="5.5" rx="2.5" fill="#7c8594"/>
    </g>

    <!-- mentorship arrow linking senior -> junior -->
    <g stroke="#0ef" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M 380 190 C 415 158, 445 158, 475 190" stroke-dasharray="5 7"/>
      <path d="M 468 183 L 475 190 L 468 197"/>
    </g>

    <!-- senior figure -->
    <g fill="#0ef">
      <circle cx="380" cy="158" r="15"/>
      <path d="M 353 208 Q 380 180 407 208 L 407 224 L 353 224 Z"/>
    </g>
    <!-- junior figure -->
    <g fill="#fff">
      <circle cx="490" cy="158" r="15"/>
      <path d="M 463 208 Q 490 180 517 208 L 517 224 L 463 224 Z"/>
    </g>
  </g>
</svg>
