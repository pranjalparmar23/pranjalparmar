<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgCS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171f2b"/>
      <stop offset="100%" stop-color="#1f2733"/>
    </linearGradient>
    <radialGradient id="glowCS" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0ef" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0ef" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgCS)"/>
  <rect width="600" height="600" fill="url(#glowCS)"/>

  <!-- college building, centered as a group on canvas -->
  <g transform="translate(0,115)">
    <polygon points="300,110 400,165 200,165" fill="#2d3542" stroke="#0ef" stroke-width="1.5"/>
    <rect x="215" y="165" width="170" height="95" fill="#2d3542" stroke="#0ef" stroke-width="1.5"/>
    <g fill="#171f2b">
      <rect x="230" y="180" width="16" height="45"/>
      <rect x="262" y="180" width="16" height="45"/>
      <rect x="322" y="180" width="16" height="45"/>
      <rect x="354" y="180" width="16" height="45"/>
    </g>
    <rect x="292" y="200" width="16" height="60" fill="#0ef"/>

    <!-- graduation cap -->
    <g transform="translate(300 88)">
      <polygon points="0,-14 40,0 0,14 -40,0" fill="#fff"/>
      <rect x="-4" y="0" width="8" height="18" fill="#7c8594"/>
      <circle cx="0" cy="20" r="4" fill="#0ef"/>
    </g>
  </g>
</svg>
