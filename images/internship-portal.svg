  <rect x="230" y="168" width="140" height="6" rx="3" fill="#7c8594"/>
  <rect x="230" y="184" width="140" height="6" rx="3" fill="#7c8594"/>
  <rect x="230" y="200" width="90" height="6" rx="3" fill="#7c8594"/>

