  </defs>
  <rect width="600" height="600" fill="url(#bgIP)"/>
  <rect width="600" height="600" fill="url(#glowIP)"/>

  <!-- certificate -->
  <rect x="205" y="120" width="190" height="140" rx="8" fill="#2d3542" stroke="#0ef" stroke-width="1.5"/>
