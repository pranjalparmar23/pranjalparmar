  <path d="M 348 264 L 348 292 L 360 282 L 372 292 L 372 264" fill="#0ef"/>
  <path d="M 352 246 L 358 253 L 370 240" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

