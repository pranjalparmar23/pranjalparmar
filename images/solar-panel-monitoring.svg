<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgSP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171f2b"/>
      <stop offset="100%" stop-color="#1f2733"/>
    </linearGradient>
    <radialGradient id="glowSP" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0ef" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0ef" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgSP)"/>
  <rect width="600" height="600" fill="url(#glowSP)"/>

  <!-- sun, panel and gauge, centered as a group on canvas -->
  <g transform="translate(0,93)">
    <circle cx="300" cy="150" r="20" fill="#0ef"/>
    <g stroke="#0ef" stroke-width="2.5" stroke-linecap="round">
      <line x1="300" y1="116" x2="300" y2="104"/>
      <line x1="330" y1="128" x2="339" y2="119"/>
      <line x1="270" y1="128" x2="261" y2="119"/>
    </g>

    <!-- solar panel grid -->
    <g transform="translate(300 195)">
      <rect x="-110" y="0" width="220" height="90" rx="4" fill="#2d3542" stroke="#0ef" stroke-width="1.5"/>
      <g stroke="#171f2b" stroke-width="2">
        <line x1="-73" y1="0" x2="-73" y2="90"/>
        <line x1="-36" y1="0" x2="-36" y2="90"/>
        <line x1="1" y1="0" x2="1" y2="90"/>
        <line x1="38" y1="0" x2="38" y2="90"/>
        <line x1="75" y1="0" x2="75" y2="90"/>
        <line x1="-110" y1="30" x2="110" y2="30"/>
        <line x1="-110" y1="60" x2="110" y2="60"/>
      </g>
    </g>

    <!-- monitoring gauge -->
    <g transform="translate(300 300)">
      <path d="M -32 10 A 32 32 0 0 1 32 10" fill="none" stroke="#7c8594" stroke-width="6" stroke-linecap="round"/>
      <path d="M -32 10 A 32 32 0 0 1 10 -30" fill="none" stroke="#0ef" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="14" y2="-14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="10" r="4" fill="#fff"/>
    </g>
  </g>
</svg>
